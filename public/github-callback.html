<html><body><script>
const params = new URLSearchParams(window.location.search);
const code = params.get("code");
const state = params.get("state");
if(code){
  fetch("https://api-to-sdk.onrender.com/github-token",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({code})
  }).then(r=>r.json()).then(d=>{
    if(d.token){
      window.opener.postMessage({type:"github-token",token:d.token,state:state}, window.location.origin);
      window.close();
    }else{
      document.body.innerText="Error: "+JSON.stringify(d);
    }
  }).catch(e=>{document.body.innerText="Error: "+e.message;});
}else{
  document.body.innerText="No code found";
}
</script><p>Connecting to GitHub...</p></body></html>
